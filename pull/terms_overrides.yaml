# Hand-curated search-term overrides for the pilot categories.
#
# Per-brand keys (all optional; brands not listed use auto topic resolution):
#   term:          use this literal search term, skip topic resolution entirely
#   topic_hint:    string to feed Trends autocomplete (default: brand name)
#   topic_title:   expected topic title to accept
#   topic_types:   acceptable topic-type substrings (case-insensitive)
#   fallback_term: term to use if no acceptable topic is found
#   note:          rationale (kept for the writeup's curation appendix)
#
# Per-category key:
#   anchor: brand used as the common-scale reference in every request batch
#           (prefer high, stable search volume + unambiguous name)

categories:

  # --- Spot fixes for bad auto-resolutions observed in the first real run ---
